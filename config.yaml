config:
  backup: true
  banner: true
  create: true
  dotpath: dotfiles
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  longkey: false
dotfiles:
  d_i3:
    src: config/i3
    dst: ~/.config/i3
  f_config.fish:
    src: config/fish/config.fish
    dst: ~/.config/fish/config.fish
  f_starship.toml:
    src: config/starship.toml
    dst: ~/.config/starship.toml
profiles:
  darkmoon:
    dotfiles:
    - d_i3
    - f_config.fish
    - f_starship.toml
